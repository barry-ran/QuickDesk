services:
  signaling-server:
    image: ghcr.io/barry-ran/quickdesk-signaling:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-quickdesk-signaling}
    restart: always
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    volumes:
      - ${DATA_DIR:-/data/quickdesk}:/data
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
