name: WebClient

on:
  push:
    paths: ['WebClient/**', 'test/fixtures/mobile-gestures.json', '.github/workflows/webclient.yml']
  pull_request:
    paths: ['WebClient/**', 'test/fixtures/mobile-gestures.json', '.github/workflows/webclient.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mobile
