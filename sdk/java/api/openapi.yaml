openapi: 3.1.0
info:
  description: |
    This document is the contract for the operations a business system needs to
    integrate with a self-hosted QuickDesk signaling server: authenticate,
    enumerate the caller's devices, verify a device access code, and manage the
    owner's access policy, guest access codes, second-factor approvals,
    offline-alert rule and notification channels.

    It deliberately covers a **subset**. The server exposes more (admin
    endpoints, the approve/deny and claim halves of the approval flow,
    recordings, realtime WebSockets); those are documented in
    `docs/user-api-docs.md` and are added here as they are pinned by a
    conformance test. Everything listed here is exercised against a live server
    by `scripts/sdk/openapi-smoke.mjs`, so a change to a documented field fails
    that check rather than silently invalidating this file.

    That smoke is read-only by default; `QD_SMOKE_DEVICE=<device_id>` adds the
    operations with side effects, and it restores what it touches: the
    offline-alert rule and the access policy (including the `approval_mode` it
    temporarily switches on to drive the approval flow) are put back exactly as
    they were, and the recording it creates is deleted again.

    Two residues are deliberate and are the reason this document says so: a
    **revoked, never-used guest code** row from the create-then-revoke probe
    (revocation, not deletion, is how a grant is disabled), and **two decided
    approval rows** on the smoke device - one approved and consumed, one denied
    - because a decision is history and the flow is auditable precisely by
    leaving it.

    Four generated clients are committed - **TypeScript** under `sdk/ts`,
    **Go** under `sdk/go`, **Python** under `sdk/python` and **Java** under
    `sdk/java` - and all four are kept in step with this file by
    `scripts/sdk/check-generated-sdk.sh`, which CI runs: an edit here without a
    regenerated client fails the build. Regenerate them with
    `scripts/sdk/generate-client.sh sdk/ts`,
    `scripts/sdk/generate-client.sh sdk/go go`,
    `scripts/sdk/generate-client.sh sdk/python python` and
    `scripts/sdk/generate-client.sh sdk/java java` (a pinned openapi-generator
    jar, so local and CI output are byte-identical); the script takes the
    language as its last argument. All four clients carry a hand-written
    `examples/` entry that the CI smoke job runs against a live server: Go runs
    the recording and approval workflows, while Python, TypeScript and Java each
    run the approval workflow through their own generated client. The
    `examples/` directories are excluded from the freshness comparison, so they
    are the only hand-written code under `sdk/`. For a fifth language, use the
    generator directly, for example:

        npx @openapitools/openapi-generator-cli generate \
          -i SignalingServer/api/openapi.yaml -g csharp -o sdk/csharp

    All non-2xx responses are RFC 7807 problem details with
    `Content-Type: application/problem+json`.
  title: QuickDesk Signaling Server - business API
  version: 1.0.0
servers:
- description: Replace with the base URL of your signaling server.
  url: https://your-signaling-host
security:
- ApiKeyAuth: []
- ApiKeyAuth: []
  BearerAuth: []
tags:
- name: auth
- name: me
- name: devices
- name: notifications
paths:
  /v1/auth/sessions:
    post:
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
          description: A session with an access token and a refresh token.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
      - ApiKeyAuth: []
      summary: Exchange a username/password for a session
      tags:
      - auth
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: The current user.
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: The authenticated user
      tags:
      - me
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/devices:
    get:
      operationId: listMyDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMyDevices_200_response"
          description: The caller's devices.
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Devices owned by the authenticated user
      tags:
      - devices
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/devices/{device_id}/offline-alert:
    get:
      description: |
        Returns the documented defaults (`enabled: false`, `after_minutes: 10`)
        when the owner never configured a rule, so a client can render the form
        without a second "does it exist" call.
      operationId: getOfflineAlert
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineAlertRule"
          description: "The rule, or its defaults."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: The owner's offline-alert rule for a device
      tags:
      - notifications
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    put:
      operationId: putOfflineAlert
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineAlertInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineAlertRule"
          description: The stored rule.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Create or replace the owner's offline-alert rule
      tags:
      - notifications
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/notification-channels:
    get:
      description: |
        `supported_events` is the authoritative list of event types a channel
        may subscribe to. The signing secret is never returned; deliveries are
        signed with `signature_header` using `signature_scheme`.
      operationId: listNotificationChannels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelList"
          description: The caller's channels plus the subscription vocabulary.
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: The user's notification channels
      tags:
      - notifications
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/recordings:
    get:
      description: |
        Cursor-paginated, newest first. `next_cursor` is opaque: pass it back
        as `?cursor=` to fetch the next page and stop when it is absent. The
        envelope here has no `total` because this endpoint does not count the
        whole set on every page, so an integrator must page until
        `next_cursor` is empty rather than trusting a count. This is the
        metadata index only; the media bytes live behind the per-recording
        `.../artifact` routes documented in `docs/user-api-docs.md`.
      operationId: listSessionRecordings
      parameters:
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecordingList"
          description: "One page of the caller's recordings, newest first."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: The caller's session-recording index
      tags:
      - recordings
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: |
        Called by the capturing side when a session starts (or when a finished
        capture is handed over), so the owner sees the recording while it is
        still being written and the row can carry the outcome afterwards.
        `status` is one of `recording`, `completed` or `failed`; `started_at`
        defaults to now. The media is uploaded separately to `.../artifact`.

        The row belongs to the *caller*: `device_id` is recorded as a label and
        is not checked for ownership, so a producer can index a capture for a
        machine that is not bound to it. Only the caller can then read or delete
        the row.
      operationId: createSessionRecording
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRecordingInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: The created index row.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Index a new recording
      tags:
      - recordings
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/recordings/{recording_id}:
    delete:
      description: |
        Removes the index row and the media files that belong to it, so the
        recording cannot be played back afterwards. There is no "already gone"
        success: a second delete is a `404`. The deletion is published on the
        owner's realtime stream and written to the audit trail as
        `recording.delete` with the actor's observed address.
      operationId: deleteSessionRecording
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Delete a recording and its stored media
      tags:
      - recordings
      x-accepts:
      - application/problem+json
    get:
      description: |
        The same row the list returns. Another user's id is a `404` rather than
        a `403`, so the route cannot be used to discover which recording ids
        exist.
      operationId: getSessionRecording
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: The recording.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: One recording the caller owns
      tags:
      - recordings
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/RecordingId"
    patch:
      description: |
        Partial update: only the fields present in the body are written, so a
        producer can patch `status` when a capture starts and then
        `size_bytes`/`ended_at` when the upload finishes. `status` accepts the
        same three values as create; anything else is a `400` and writes
        nothing.
      operationId: updateSessionRecording
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRecordingPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: The updated recording.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Update a recording's lifecycle metadata
      tags:
      - recordings
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/recordings/{recording_id}/artifact:
    get:
      description: |
        Owner-only, `Authorization` (Bearer) required. The response is the
        stored file itself: the `Content-Type` follows the stored file's
        extension (`video/mp4` for `.mp4`, `application/octet-stream`
        otherwise) and `Content-Disposition` is `inline`. A browser cannot
        attach an `Authorization` header to `<video src>`, which is why the
        ticket routes below exist; this route is for API clients.
      operationId: downloadRecordingArtifact
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            video/mp4:
              schema:
                format: binary
                type: string
          description: The media bytes.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Download a recording's media bytes
      tags:
      - recordings
      x-accepts:
      - application/problem+json
      - video/mp4
    parameters:
    - $ref: "#/components/parameters/RecordingId"
    patch:
      description: |
        The resumable half of the upload contract, for a capture that does not
        fit in one request body or a connection that drops halfway. The client
        sends chunks; the server answers with the offset it actually holds in
        the `Upload-Offset` response header, so a retry resumes from that number
        instead of starting over.

        Three headers drive it. `Upload-Offset` (required) is where the chunk
        starts and must equal the bytes already staged; otherwise the answer is
        `409` with the authoritative offset in the same header and the client
        resyncs. `Upload-Length` (optional, `*` while unknown) declares the total
        size, which lets the server finish by itself when the last byte lands and
        lets it refuse a chunk that would overshoot. `Upload-Complete: 1` says
        this chunk ends the upload, which is how a client finishes without ever
        declaring a total.

        A status probe asks where the upload stands without staging bytes. Send
        `Upload-Probe: 1` with a valid `Upload-Offset` and no body; the answer is
        `202` with the current offset, so a client that crashed can re-learn
        where it stopped without a second endpoint. An empty body with a valid
        offset does the same thing for raw-HTTP callers, but a generated client
        cannot send a zero-length body, which is why the explicit header exists.

        The staging file (`<artifact-path>.part`) is subject to the same size
        limit as the single-shot upload, an empty artifact is refused on every
        path, and the recording lifecycle deletes a staging file that has been
        untouched for six hours.
      operationId: appendRecordingArtifact
      parameters:
      - description: "The artifact extension, allow-listed exactly like the raw-body\
          \ POST shape."
        explode: true
        in: query
        name: ext
        required: true
        schema:
          enum:
          - .mp4
          - .m4v
          - .mkv
          - .webm
          - .h264
          - .grf
          type: string
        style: form
      - description: The byte offset this chunk starts at.
        explode: false
        in: header
        name: Upload-Offset
        required: true
        schema:
          format: int64
          minimum: 0
          type: integer
        style: simple
      - description: "The total size of the artifact, or `*` while it is unknown."
        explode: false
        in: header
        name: Upload-Length
        required: false
        schema:
          type: string
        style: simple
      - description: Set to `1` when this chunk ends the upload.
        explode: false
        in: header
        name: Upload-Complete
        required: false
        schema:
          enum:
          - "0"
          - "1"
          type: string
        style: simple
      - description: Set to `1` to ask for the current offset without staging any
          bytes. The generated clients use this instead of an empty body.
        explode: false
        in: header
        name: Upload-Probe
        required: false
        schema:
          enum:
          - "0"
          - "1"
          type: string
        style: simple
      - $ref: "#/components/parameters/RecordingId"
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: The final chunk; the recording now carries the stored artifact.
          headers:
            Upload-Offset:
              description: "Bytes staged, which for a finished upload is the artifact\
                \ size."
              explode: false
              schema:
                format: int64
                type: integer
              style: simple
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: |
            The chunk was staged and more are expected. The authoritative offset
            is the `Upload-Offset` response header. The body is the recording
            row - the same `SessionRecording` schema as the `200` - because a
            generated client declares one success type per operation and would
            otherwise fail to decode a staging-only body.
          headers:
            Upload-Offset:
              description: Bytes staged so far; a client resumes from this number.
              explode: false
              schema:
                format: int64
                type: integer
              style: simple
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: |
            `Upload-Offset` did not match the bytes already staged. The header
            carries the authoritative offset, so the client can resume from it.
          headers:
            Upload-Offset:
              description: The offset the server actually holds.
              explode: false
              schema:
                format: int64
                type: integer
              style: simple
      summary: Append one chunk of a resumable recording upload
      tags:
      - recordings
      x-content-type: application/octet-stream
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: |
        Two request shapes, because the producers differ: `multipart/form-data`
        with a `file` part (the browser and Qt clients) or the raw body with
        `?ext=`. The extension is allow-listed (`.mp4`, `.m4v`, `.mkv`, `.webm`,
        `.h264`, `.grf`), the bytes are written to a temporary file and renamed
        into place so a dropped upload can never leave a half-written file under
        the real name, and the row is then updated with `artifact_path`,
        `artifact_url`, `format` and `size_bytes` in one step.

        An empty body is a `400`; a body over the configured limit
        (`RECORDING_MAX_BYTES`, exposed as `store.max_bytes`) is a `400` as well,
        never a truncated file. Uploading again replaces the stored artifact.
      operationId: uploadRecordingArtifact
      parameters:
      - description: Required for the raw-body shape; ignored for multipart.
        explode: true
        in: query
        name: ext
        required: false
        schema:
          enum:
          - .mp4
          - .m4v
          - .mkv
          - .webm
          - .h264
          - .grf
          type: string
        style: form
      - $ref: "#/components/parameters/RecordingId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadRecordingArtifact_request"
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: "The recording, now carrying the stored artifact."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Upload a recording's media bytes
      tags:
      - recordings
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/recordings/{recording_id}/thumbnail:
    get:
      description: |
        Owner-only. Served with `Cache-Control: private, max-age=300` because a
        preview is user-scoped and can change under the same URL.
      operationId: downloadRecordingThumbnail
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
          description: The preview image bytes.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Download a recording's preview image
      tags:
      - recordings
      x-accepts:
      - application/problem+json
      - image/jpeg
    parameters:
    - $ref: "#/components/parameters/RecordingId"
    post:
      description: |
        The same two shapes as the artifact upload (`multipart/form-data` with a
        `file` part, or the raw body with `?ext=`), but the extension is limited
        to `.jpg`, `.jpeg` and `.png` and the size to 2 MiB - a preview is a
        small still, and an oversized one means the wrong file was sent.

        The bytes are sniffed before they are stored rather than trusted from
        the name or the declared content type: the index renders this image
        inline, so a file that only claims to be a JPEG is a `400`.
      operationId: uploadRecordingThumbnail
      parameters:
      - description: Required for the raw-body shape; ignored for multipart.
        explode: true
        in: query
        name: ext
        required: false
        schema:
          enum:
          - .jpg
          - .jpeg
          - .png
          type: string
        style: form
      - $ref: "#/components/parameters/RecordingId"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadRecordingArtifact_request"
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecording"
          description: "The recording, now carrying the preview."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Upload a recording's preview image
      tags:
      - recordings
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/recordings/{recording_id}/artifact-ticket:
    parameters:
    - $ref: "#/components/parameters/RecordingId"
    post:
      description: |
        Owner-only. Returns a signed, time-limited `url` that can be fetched
        **without** an `Authorization` header, which is what makes playback work
        from `<video src>`. The ticket is bound to the recording, the owner and
        its purpose, so an artifact ticket cannot be replayed against the
        thumbnail route. Minting is stateless - nothing is written - and the
        link stops working when `expires_at` passes. `400` when playback tickets
        are disabled on the deployment (`RECORDING_URL_SECRET`/`API_KEY` unset);
        `404` when the recording has no stored artifact.
      operationId: createRecordingArtifactTicket
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackTicket"
          description: A signed playback URL.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Mint a short-lived playback URL for a recording
      tags:
      - recordings
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/recordings/{recording_id}/thumbnail-ticket:
    parameters:
    - $ref: "#/components/parameters/RecordingId"
    post:
      description: |
        Same rules as the artifact ticket, but the URL addresses the thumbnail
        route and the ticket's purpose is checked on redemption.
      operationId: createRecordingThumbnailTicket
      parameters:
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackTicket"
          description: A signed preview URL.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Mint a short-lived preview URL for a recording
      tags:
      - recordings
      x-accepts:
      - application/json
      - application/problem+json
  /v1/recordings/{recording_id}/artifact:
    get:
      description: |
        The URL returned by `POST /v1/me/recordings/{recording_id}/artifact-ticket`.
        Deliberately registered **outside** the API-key and user-auth groups,
        because a browser `<video>` element can send neither header - the signed
        `t` query parameter is the authorization, and the ticket is bound to
        owner and purpose. `401` for a missing, malformed or expired ticket;
        `404` when the ticket is for the wrong route or the recording is gone.
      operationId: downloadRecordingArtifactByTicket
      parameters:
      - description: The signed ticket from the artifact-ticket endpoint.
        explode: true
        in: query
        name: t
        required: true
        schema:
          type: string
        style: form
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            video/mp4:
              schema:
                format: binary
                type: string
          description: The media bytes.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Fetch recording media with a playback ticket
      tags:
      - recordings
      x-accepts:
      - application/problem+json
      - video/mp4
    parameters:
    - $ref: "#/components/parameters/RecordingId"
  /v1/recordings/{recording_id}/thumbnail:
    get:
      description: |
        The URL returned by `POST /v1/me/recordings/{recording_id}/thumbnail-ticket`.
        Same ticket rules as the artifact route; an artifact ticket is rejected
        here (`404`) because the purpose is part of the signature.
      operationId: downloadRecordingThumbnailByTicket
      parameters:
      - description: The signed ticket from the thumbnail-ticket endpoint.
        explode: true
        in: query
        name: t
        required: true
        schema:
          type: string
        style: form
      - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
          description: The preview image bytes.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Fetch a recording preview with a playback ticket
      tags:
      - recordings
      x-accepts:
      - application/problem+json
      - image/jpeg
    parameters:
    - $ref: "#/components/parameters/RecordingId"
  /v1/devices/{device_id}/access-code:verify:
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    post:
      description: |
        The controller-side entry point. On success it returns a signal token
        for the relay. When the device policy wants the owner to confirm the
        session it returns `202` with a pending approval instead, and the caller
        polls `/v1/devices/{device_id}/access-approvals:claim`. A rejected code
        is a `403` problem with `code: INVALID_CODE`.

        This route is reachable without a user token (the controlling client is
        not logged in) but still requires the API key or an allowed Origin.
      operationId: verifyAccessCode
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessCodeVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeVerifyResponse"
          description: The code was accepted and a signal token was minted.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeApprovalPending"
          description: The device policy requires the owner to approve this session.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
      - ApiKeyAuth: []
      summary: Verify a device access code and mint a signal token
      tags:
      - devices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/devices/{device_id}/access-policy:
    get:
      description: |
        Returns the documented "no policy" defaults when the owner never saved
        one, so a client can render the form without a second existence check.
      operationId: getAccessPolicy
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAccessPolicy"
          description: "The policy, or its defaults."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: The device's access policy
      tags:
      - devices
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    put:
      description: |
        A **full replace**: every field not sent is reset to its zero value. The
        policy is enforced on the device-side verify route before the access
        code is compared, so a blocked client never gets to guess codes.
      operationId: putAccessPolicy
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAccessPolicyInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAccessPolicy"
          description: The stored policy.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Create or replace the device's access policy
      tags:
      - devices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/devices/{device_id}/access-grants:
    get:
      operationId: listAccessGrants
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAccessGrants_200_response"
          description: "The device's grants, newest first."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Guest access codes issued for a device
      tags:
      - devices
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    post:
      description: |
        The plaintext code is returned **once**, in the creation response; a
        grant is limited by expiry and uses, may be bound to a client id and/or
        source addresses, and is revoked with the DELETE below.
      operationId: createAccessGrant
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
          description: "The created grant, including its one-time plaintext code."
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Issue a time-boxed guest access code
      tags:
      - devices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/devices/{device_id}/access-grants/{grant_id}:
    delete:
      operationId: revokeAccessGrant
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      - explode: false
        in: path
        name: grant_id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/revokeAccessGrant_200_response"
          description: The grant is no longer redeemable.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Revoke a guest access code
      tags:
      - devices
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    - explode: false
      in: path
      name: grant_id
      required: true
      schema:
        format: int64
        type: integer
      style: simple
  /v1/me/devices/{device_id}/access-approvals:
    get:
      description: |
        `status` is a comma-separated subset of `pending, approved, denied,
        expired, consumed` and defaults to `pending`. Approval is created by the
        device-side verify route when the policy asks for it; approving or
        denying happens on the sub-resource routes documented in
        `docs/user-api-docs.md` §5.3.5 (not yet part of this contract).
      operationId: listAccessApprovals
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAccessApprovals_200_response"
          description: "The matching approvals, newest first."
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Second-factor approvals awaiting (or already decided by) the owner
      tags:
      - devices
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/DeviceId"
  /v1/me/devices/{device_id}/access-approvals:summary:
    get:
      description: |
        The row list shows requests one at a time; this is what makes "one
        address has been refused six times this afternoon" legible. The window
        is keyed on `created_at` for every count.
      operationId: getAccessApprovalSummary
      parameters:
      - description: RFC3339 start of the window; defaults to the last 24 hours.
        explode: true
        in: query
        name: since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "How many refused sources to list (default 5, capped at 10)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSummary"
          description: The window's counts and refused sources.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Aggregated view of a device's approval queue
      tags:
      - devices
      x-accepts:
      - application/json
      - application/problem+json
    parameters:
    - $ref: "#/components/parameters/DeviceId"
  /v1/me/devices/{device_id}/access-approvals/{approval_id}/approve:
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    - $ref: "#/components/parameters/ApprovalId"
    post:
      description: |
        Owner-only. The body is optional; a `reason` is stored on the row and
        shown to the requester. A request that was already decided or has
        expired returns `409` with the current status instead of pretending the
        decision landed. The conformance smoke pins the `404` shape with an
        unknown id; the happy path needs a real pending approval (an online
        device plus `approval_mode`), so it is covered by the end-to-end run in
        `docs/dev/自托管端到端联调记录.md` rather than the smoke.
      operationId: approveAccessApproval
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approveAccessApproval_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessApproval"
          description: The approval after the decision.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAlreadyDecided"
          description: The request was already decided or has expired.
      summary: Approve a pending access request
      tags:
      - devices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/me/devices/{device_id}/access-approvals/{approval_id}/deny:
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    - $ref: "#/components/parameters/ApprovalId"
    post:
      description: |
        Owner-only, same shape as `approve`. Denying also arms the per-source
        denial cooldown (`APPROVAL_DENIAL_COOLDOWN_SECONDS`), so the same client
        cannot immediately re-request.
      operationId: denyAccessApproval
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approveAccessApproval_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessApproval"
          description: The approval after the decision.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAlreadyDecided"
          description: The request was already decided or has expired.
      summary: Deny a pending access request
      tags:
      - devices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/devices/{device_id}/access-approvals:claim:
    parameters:
    - $ref: "#/components/parameters/DeviceId"
    post:
      description: |
        The requesting controller calls this with the `approval_id` and
        `approval_secret` it received from `access-code:verify`. It is API-key
        gated rather than user-authenticated because the caller has no account.
        `202` means the owner has not decided yet - keep polling with the same
        id and secret; `200` returns the signal token; `403` means denied or
        expired; `409` means the approval was already spent or the host went
        offline before the exchange.
      operationId: claimAccessApproval
      parameters:
      - $ref: "#/components/parameters/DeviceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalClaimRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeVerifyResponse"
          description: The owner approved and the signal token is ready.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalClaimPending"
          description: Still waiting for the owner to decide.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalClaimConsumed"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: |
            The approval was already spent, or the host went offline before the
            exchange could happen.
      summary: Exchange an approved request for a signal token
      tags:
      - devices
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /v1/update:check:
    get:
      description: |
        The client-facing half of the self-hosted update channel. It is API-key
        gated but not user-authenticated: a controlled machine checks for
        updates before anyone logs in.

        The server owns the index of published releases. The artifact lives at
        `download_url`: normally a host the operator controls, or this server
        itself when the installer was uploaded to it (then `download_url` is
        `GET /v1/update-releases/{release_id}/artifact` and `hosted_here` is
        true). The index is managed through the admin API
        (`POST /v1/admin/update-releases` and friends), which stays outside this
        business contract.

        `current_version` is optional. Without it the newest release is returned
        and `update_available` is true whenever one exists; with it,
        `update_available` is true only when the published version is strictly
        newer, and `mandatory` mirrors the release flag once an update is
        available. `latest` is always present and is `null` when the channel has
        no release for that platform/arch.
      operationId: checkForUpdate
      parameters:
      - description: Which operating system the caller is running.
        explode: true
        in: query
        name: platform
        required: true
        schema:
          enum:
          - windows
          - macos
          - linux
          type: string
        style: form
      - description: Which architecture the caller is running.
        explode: true
        in: query
        name: arch
        required: true
        schema:
          enum:
          - x64
          - arm64
          - universal
          type: string
        style: form
      - description: Defaults to `stable`.
        explode: true
        in: query
        name: channel
        required: false
        schema:
          enum:
          - stable
          - beta
          - nightly
          type: string
        style: form
      - description: "The dotted numeric version the caller is running, e.g. `4.2.5.0`.\
          \ A leading `v` is accepted."
        explode: true
        in: query
        name: current_version
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResult"
          description: "The newest release for that channel/platform/arch, or a null\
            \ `latest` when the channel is empty."
        "400":
          $ref: "#/components/responses/BadRequest"
      summary: Check the self-hosted update channel for a newer build
      tags:
      - update
      x-accepts:
      - application/json
      - application/problem+json
  /v1/update-releases/{release_id}/artifact:
    get:
      description: |
        The other half of a re-hosted release. `GET /v1/update:check` returns the
        `download_url` of the newest build, and for a release whose bytes were
        uploaded to this server that URL is this route, under the same API key
        the client already used for the check.

        API-key gated but not user-authenticated, like the check itself. The
        response supports range requests, so a transfer that drops can resume.

        A release whose bytes live on an external static host is not served here:
        fetching its route is a `404`, and the client should use the
        `download_url` from the check response instead.
      operationId: downloadUpdateArtifact
      parameters:
      - description: The `id` of the release from the check response.
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The installer bytes.
          headers:
            Content-Disposition:
              description: "The stored file name, as an attachment."
              explode: false
              schema:
                type: string
              style: simple
            Accept-Ranges:
              description: Present because range requests are supported.
              explode: false
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Download an installer this server hosts itself
      tags:
      - update
      x-accepts:
      - application/octet-stream
      - application/problem+json
components:
  parameters:
    DeviceId:
      description: The device id shown on the controlled machine.
      explode: false
      in: path
      name: device_id
      required: true
      schema:
        maxLength: 20
        type: string
      style: simple
    ApprovalId:
      description: The numeric id from an approval row.
      explode: false
      in: path
      name: approval_id
      required: true
      schema:
        format: int64
        minimum: 1
        type: integer
      style: simple
    RecordingId:
      description: The numeric id from a recording index row.
      explode: false
      in: path
      name: recording_id
      required: true
      schema:
        format: int64
        minimum: 1
        type: integer
      style: simple
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The request was malformed or failed validation.
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Missing or expired credentials.
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Authenticated but not allowed (includes a rejected access code).
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The addressed resource does not exist.
    RateLimited:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Too many requests; retry after the advertised delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          explode: false
          schema:
            type: string
          style: simple
  schemas:
    AuthSessionRequest:
      example:
        identifier: identifier
        password: password
      properties:
        identifier:
          description: "Username, phone, or email, depending on how the account was\
            \ created."
          type: string
        password:
          format: password
          type: string
      required:
      - identifier
      - password
    AuthSessionResponse:
      example:
        access_token: access_token
        refresh_expires_at: 2000-01-23T04:56:07.000+00:00
        refresh_token: refresh_token
        access_expires_at: 2000-01-23T04:56:07.000+00:00
        user:
          updated_at: 2000-01-23T04:56:07.000+00:00
          phone: phone
          level: level
          created_at: 2000-01-23T04:56:07.000+00:00
          id: 0
          channel_type: channel_type
          email: email
          device_count: 6
          username: username
          status: true
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        access_expires_at:
          format: date-time
          type: string
        refresh_token:
          type: string
        refresh_expires_at:
          format: date-time
          type: string
      required:
      - access_expires_at
      - access_token
      - refresh_expires_at
      - refresh_token
      - user
    User:
      example:
        updated_at: 2000-01-23T04:56:07.000+00:00
        phone: phone
        level: level
        created_at: 2000-01-23T04:56:07.000+00:00
        id: 0
        channel_type: channel_type
        email: email
        device_count: 6
        username: username
        status: true
      properties:
        id:
          format: int64
          type: integer
        username:
          type: string
        phone:
          type: string
        email:
          type: string
        level:
          type: string
        device_count:
          type: integer
        channel_type:
          type: string
        status:
          type: boolean
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - status
      - username
    Device:
      example:
        device_name: device_name
        device_id: device_id
        os: os
        app_version: app_version
        logged_in: true
        access_code: access_code
        os_version: os_version
        online: true
        remark: remark
        last_seen_at: last_seen_at
      properties:
        device_id:
          type: string
        device_name:
          type: string
        remark:
          description: The owner's private note; empty when none is set.
          type: string
        online:
          description: Whether the machine currently holds a live connection.
          type: boolean
        logged_in:
          description: "True only when the device is online *and* logged in, so a\
            \ parked machine is not reported as reachable."
          type: boolean
        access_code:
          description: "The current access code. It rotates, so treat it as short-lived."
          type: string
        os:
          type: string
        os_version:
          type: string
        app_version:
          type: string
        last_seen_at:
          description: "RFC3339 UTC, omitted when the device has never been seen."
