          description: The device the capture came from.
          type: string
        device_name:
          type: string
        session_id:
          description: "The control session this recording belongs to, when there\
            \ is one."
          type: string
        status:
          description: How far the capture got when this row was written.
          enum:
          - recording
          - completed
          - failed
          type: string
        format:
          description: Free-form label; the upload route overwrites it from the file
            extension.
          type: string
        artifact_path:
          description: Server-side path. Set by the upload route; clients do not need
            to send it.
          type: string
        artifact_url:
          type: string
        thumbnail_path:
          type: string
        duration_seconds:
          minimum: 0
          type: integer
        size_bytes:
          minimum: 0
          type: integer
        started_at:
          description: Defaults to the time the row was created when omitted.
          format: date-time
          nullable: true
          type: string
        ended_at:
          format: date-time
          nullable: true
          type: string
      required:
      - device_id
      - status
    SessionRecordingPatch:
      description: |
        Partial update - every field is optional and only the ones present are
        written, so a producer can patch the row as the capture progresses.
      example:
        duration_seconds: 0
        artifact_url: artifact_url
        thumbnail_path: thumbnail_path
        artifact_path: artifact_path
        size_bytes: 0
        format: format
        ended_at: 2000-01-23T04:56:07.000+00:00
        status: recording
      properties:
        status:
          enum:
          - recording
          - completed
          - failed
          type: string
        format:
          type: string
        artifact_path:
          type: string
        artifact_url:
          type: string
        thumbnail_path:
          type: string
        duration_seconds:
          minimum: 0
          type: integer
        size_bytes:
          minimum: 0
          type: integer
        ended_at:
          format: date-time
          nullable: true
          type: string
    SessionRecording:
      description: |
        One indexed recording. The row is the control-plane metadata; the media
        artifact is produced by the control engine and fetched through the
        artifact routes. `artifact_path` is a server-side path and is not a
        download URL - clients should call `.../artifact-ticket` and use the
        URL they get back.
      example:
        duration_seconds: 1
        size_bytes: 5
        device_id: device_id
        format: format
        session_id: session_id
        created_at: 2000-01-23T04:56:07.000+00:00
        thumbnail_url: thumbnail_url
        artifact_url: artifact_url
        device_name: device_name
        thumbnail_path: thumbnail_path
        artifact_path: artifact_path
        updated_at: 2000-01-23T04:56:07.000+00:00
        user_id: 6
        started_at: 2000-01-23T04:56:07.000+00:00
        id: 0
        user: "{}"
        ended_at: 2000-01-23T04:56:07.000+00:00
        status: recording
      properties:
        id:
          type: integer
        user_id:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
        session_id:
          type: string
        status:
          description: |
            `recording` while the capture is in progress, then `completed` or
            `failed`. A stale `recording` row is swept to `failed` by the
            recording lifecycle worker.
          enum:
          - recording
          - completed
          - failed
          type: string
        format:
          description: "Container/codec hint, e.g. `mp4`, `h264`, `grf`."
          type: string
        artifact_path:
          description: Server-side stored path; not a client-fetchable URL.
          type: string
        artifact_url:
          type: string
        thumbnail_path:
          type: string
        thumbnail_url:
          type: string
        duration_seconds:
          type: integer
        size_bytes:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        ended_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        user:
          description: |
            The owning user, present when the server eager-loads it. Optional -
            clients must not depend on this being present.
          type: object
      required:
      - artifact_path
      - artifact_url
      - created_at
      - device_id
      - device_name
      - duration_seconds
      - format
      - id
      - session_id
      - size_bytes
      - started_at
      - status
      - thumbnail_path
      - thumbnail_url
      - updated_at
      - user_id
    SessionRecordingList:
      description: |
        Cursor page of recordings. `next_cursor` is absent on the last page;
        `total` is intentionally absent because this endpoint does not count the
        whole set per page.
      example:
        next_cursor: next_cursor
        items:
        - duration_seconds: 1
          size_bytes: 5
          device_id: device_id
          format: format
          session_id: session_id
          created_at: 2000-01-23T04:56:07.000+00:00
          thumbnail_url: thumbnail_url
          artifact_url: artifact_url
          device_name: device_name
          thumbnail_path: thumbnail_path
          artifact_path: artifact_path
          updated_at: 2000-01-23T04:56:07.000+00:00
          user_id: 6
          started_at: 2000-01-23T04:56:07.000+00:00
          id: 0
          user: "{}"
          ended_at: 2000-01-23T04:56:07.000+00:00
          status: recording
        - duration_seconds: 1
          size_bytes: 5
          device_id: device_id
          format: format
          session_id: session_id
          created_at: 2000-01-23T04:56:07.000+00:00
          thumbnail_url: thumbnail_url
          artifact_url: artifact_url
          device_name: device_name
          thumbnail_path: thumbnail_path
          artifact_path: artifact_path
          updated_at: 2000-01-23T04:56:07.000+00:00
          user_id: 6
          started_at: 2000-01-23T04:56:07.000+00:00
          id: 0
          user: "{}"
          ended_at: 2000-01-23T04:56:07.000+00:00
          status: recording
      properties:
        items:
          items:
            $ref: "#/components/schemas/SessionRecording"
          type: array
        next_cursor:
          type: string
      required:
      - items
    ApprovalAlreadyDecided:
      description: |
        Returned by approve/deny when the request was already decided (or
        expired) so the click is reported honestly instead of silently
        succeeding.
      example:
        message: message
        status: pending
      properties:
        status:
          enum:
          - pending
          - approved
          - denied
          - expired
          - consumed
          type: string
        message:
          type: string
      required:
      - message
      - status
    ApprovalClaimRequest:
      example:
        secret: secret
        approval_id: 0
      properties:
        approval_id:
          format: int64
          type: integer
        secret:
          description: The `approval_secret` returned once by `access-code:verify`.
          type: string
      required:
      - approval_id
      - secret
    ApprovalClaimPending:
      description: The owner has not decided yet; poll again after `poll_after_ms`.
      example:
        expires_at: 2000-01-23T04:56:07.000+00:00
        poll_after_ms: 0
        status: pending
      properties:
        status:
          enum:
          - pending
          type: string
        expires_at:
          format: date-time
          type: string
        poll_after_ms:
          type: integer
      required:
      - expires_at
      - poll_after_ms
      - status
    ApprovalClaimConsumed:
      description: The approval was already exchanged for a token.
      example:
        message: message
        status: consumed
      properties:
        status:
          enum:
          - consumed
          type: string
        message:
          type: string
      required:
      - message
      - status
    PlaybackTicket:
      description: |
        A signed, time-limited URL for one recording's media or preview. It
        carries no credentials, so it must be treated as a bearer token: anyone
        who holds the link can fetch the file until `expires_at`.
      example:
        expires_at: 2000-01-23T04:56:07.000+00:00
        url: url
      properties:
        url:
          description: Absolute path (with the signed `t` parameter) to fetch.
          type: string
        expires_at:
          format: date-time
          type: string
      required:
      - expires_at
      - url
